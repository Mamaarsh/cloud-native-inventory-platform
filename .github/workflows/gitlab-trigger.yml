name: Sync and Trigger GitLab CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  sync-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push changes to Hamgit
        run: |
          git remote add hamgit https://${{ secrets.HAMGIT_USERNAME }}:${{ secrets.HAMGIT_TOKEN }}@hamgit.ir/Mamaarsh/cloud-native-inventory-platform.git || true
          git push hamgit main --force
      - name: Trigger GitLab Pipeline
        run: |
          curl --fail \
          --request POST \
          --form token=${{ secrets.GITLAB_TRIGGER_TOKEN }} \
          --form ref=main \
          https://hamgit.ir/api/v4/projects/48015/trigger/pipeline