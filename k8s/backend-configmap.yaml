apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: inventory
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: cloud-native-inventory-platform
data:
  DB_NAME: inventory
  DB_HOST: postgres
  DB_PORT: "5432"
  ALLOWED_HOSTS: "inventory.local,localhost,127.0.0.1"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/1"