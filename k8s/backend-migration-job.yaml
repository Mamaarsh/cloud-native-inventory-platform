apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migration
  namespace: inventory
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: cloud-native-inventory-platform
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: cloud-native-inventory-platform
    spec:
      serviceAccountName: migration-sa
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name:  nexus-registry-secret
      containers:
        - name: migrate
          image: nexus.local:8084/inventory/backend:latest
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          command: 
            - /bin/sh
            - -c
            - |
              set -e
              python manage.py migrate --noinput
              python manage.py create_roles
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: database-secret
            - secretRef:
                name: backend-secret