apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migration
  namespace: inventory
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: cloud-native-inventory-platform
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: cloud-native-inventory-platform
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name:  nexus-registry-secret
      containers:
        - name: migrate
          image: nexus.local:8084/inventory/backend:latest
          command: 
            - python
            - manage.py
            - migrate
            - --noinput
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: database-secret
            - secretRef:
                name: backend-secret