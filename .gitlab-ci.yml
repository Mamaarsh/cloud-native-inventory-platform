workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - when: never

stages:
  - test
  - build

backend-test:
  stage: test
  tags:
    - inventory-runner
  image: python:3.14
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: inventory-test
    POSTGRES_USER: inventory_user
    POSTGRES_PASSWORD: inventory_password

    DB_NAME: inventory-test
    DB_USER: inventory_user
    DB_PASSWORD: inventory_password
    DB_HOST: postgres
    DB_PORT: 5432
  script:
    - echo "Running backend tests inside Docker"
    - cd application/backend
    - python --version
    - pip install -r requirements.txt
    - python manage.py check
    - python manage.py test

backend-build:
  stage: build
  tags:
    - inventory-runner
  image: docker:latest
  script:
    - echo "Building Docker image"
    - docker build \
      -t inventory-backend:$CI_COMMIT_SHORT_SHA \
      -f application/backend/Dockerfile \
      .