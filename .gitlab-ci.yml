workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - when: never

stages:
  - test
  - build
  - cleanup

backend-test:
  stage: test
  tags:
    - inventory-runner
  image:
    name: 192.168.122.1:8083/python:3.14
    pull_policy: if-not-present
  services:
    - name: 192.168.122.1:8083/postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: inventory-test
    POSTGRES_USER: inventory_user
    POSTGRES_PASSWORD: inventory_password

    DB_NAME: inventory-test
    DB_USER: inventory_user
    DB_PASSWORD: inventory_password
    DB_HOST: postgres
    DB_PORT: 5432
  script:
    - echo "Running backend tests inside Docker"
    - cd application/backend
    - python --version
    - pip install -r requirements.txt
    - python manage.py check
    - python manage.py test

backend-build:
  stage: build
  tags:
    - inventory-runner
  image:
    name: 192.168.122.1:8083/docker:latest
    pull_policy: if-not-present
  script:
    - echo "Building Docker image"
    - docker build -t inventory-backend:$CI_COMMIT_SHORT_SHA application/backend
    - echo "Login to Nexus registry"
    - echo "$NEXUS_PASSWORD" | docker login -u "$NEXUS_USERNAME" --password-stdin "$NEXUS_REGISTRY"
    - echo "Tagging image"
    - docker tag inventory-backend:$CI_COMMIT_SHORT_SHA $NEXUS_REGISTRY/inventory/backend:$CI_COMMIT_SHORT_SHA
    - docker tag inventory-backend:$CI_COMMIT_SHORT_SHA $NEXUS_REGISTRY/inventory/backend:latest
    - echo "Pushing image"
    - docker push $NEXUS_REGISTRY/inventory/backend:$CI_COMMIT_SHORT_SHA
    - docker push $NEXUS_REGISTRY/inventory/backend:latest

frontend-test:
  stage: test
  tags:
    - inventory-runner
  image:
    name: 192.168.122.1:8083/node:22-alpine
    pull_policy: if-not-present
  variables:
    VITE_API_URL: "/api"
  script:
    - echo "Running frontend checks"
    - cd application/frontend
    - node --version
    - npm --version
    - npm ci
    - npm run lint
    - npm run build

frontend-build:
  stage: build
  tags:
    - inventory-runner
  image:
    name: 192.168.122.1:8083/docker:latest
    pull_policy: if-not-present
  script:
    - echo "Building frontend Docker image"
    - docker build --build-arg VITE_API_URL=/api -t inventory-frontend:$CI_COMMIT_SHORT_SHA application/frontend
    - echo "Login to Nexus registry"
    - echo "$NEXUS_PASSWORD" | docker login -u "$NEXUS_USERNAME" --password-stdin "$NEXUS_REGISTRY"
    - echo "Tagging frontend image"
    - docker tag inventory-frontend:$CI_COMMIT_SHORT_SHA $NEXUS_REGISTRY/inventory/frontend:$CI_COMMIT_SHORT_SHA
    - docker tag inventory-frontend:$CI_COMMIT_SHORT_SHA $NEXUS_REGISTRY/inventory/frontend:latest
    - echo "Pushing frontend image"
    - docker push $NEXUS_REGISTRY/inventory/frontend:$CI_COMMIT_SHORT_SHA
    - docker push $NEXUS_REGISTRY/inventory/frontend:latest

cleanup:
  stage: cleanup
  tags:
    - inventory-runner
  image:
    name: 192.168.122.1:8083/docker:latest
    pull_policy: if-not-present
  script:
    - docker system prune -af --filter "until=168h"
  when: manual